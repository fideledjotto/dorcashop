<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration | DORCASHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body admin-page-body">
  <header class="admin-topbar">
    <div class="container admin-topbar-inner">
      <a href="index.html" class="brand-inline" aria-label="Retour à l'accueil">
        <img src="images/logo.png" alt="DORCASHOP logo" class="logo-image admin-brand-logo">
      </a>
      <div class="topbar-actions desktop-actions">
        <a href="index.html" class="btn btn-outline btn-sm">Retour au site</a>
        <button type="button" id="logoutBtn" class="btn btn-primary btn-sm">Déconnexion</button>
      </div>

      <button type="button" class="admin-menu-toggle" id="adminMenuToggle" aria-expanded="false" aria-controls="adminMobileMenu" aria-label="Ouvrir le menu administration">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="admin-mobile-menu" id="adminMobileMenu" aria-label="Menu administration">
        <a href="index.html" class="btn btn-outline btn-sm">Retour au site</a>
        <button type="button" id="logoutBtnMobile" class="btn btn-primary btn-sm">Déconnexion</button>
      </nav>
    </div>
  </header>

  <main class="admin-shell admin-shell-admin">
    <section class="admin-dashboard">
      <div class="admin-header-row">
        <div>
          
          <h1>Gérez les produits de votre boutique.</h1>
        </div>
      </div>

      <div id="adminGlobalMessage" class="admin-message success" hidden></div>

      <section class="admin-panel">
        <div class="panel-head">
          <h2>Ajouter un produit</h2>
        </div>

        <form id="adminProductForm" class="admin-form admin-grid" novalidate>
          <div class="form-group form-group-full">
            <label for="productImage">Photo du produit</label>
            <div class="file-upload-wrap">
              <input id="productImage" name="productImage" type="file" accept="image/*">
              <img id="productImagePreview" class="product-preview" alt="Aperçu du produit" hidden>
            </div>
          </div>

          <div class="form-group">
            <label for="productName">Nom du produit</label>
            <input id="productName" name="productName" type="text" placeholder="Ex. Cahiers simples" required>
          </div>

          <div class="form-group">
            <label for="productCategory">Catégorie</label>
            <select id="productCategory" name="productCategory" required>
              <option value="fournitures">Fournitures scolaires</option>
              <option value="etudiants">Etudiants</option>
              <option value="enfants">Enfants</option>
              <option value="maison">Maison</option>
              <option value="gros">Gros</option>
            </select>
          </div>

          <div class="form-group">
            <label for="productPrice">Prix</label>
            <input id="productPrice" name="productPrice" type="text" placeholder="Ex. 1 200 F" required>
          </div>

          <div class="form-group">
            <label for="productOldPrice">Ancien prix</label>
            <input id="productOldPrice" name="productOldPrice" type="text" placeholder="Ex. 1 500 F">
          </div>

          <div class="form-group">
            <label for="productBadge">Badge / promotion</label>
            <select id="productBadge" name="productBadge">
              <option value="">Aucun</option>
              <option value="PROMO">PROMO</option>
              <option value="GROS">GROS</option>
              <option value="BON PLAN">BON PLAN</option>
              <option value="NOUVEAU">NOUVEAU</option>
            </select>
          </div>

          <div class="form-group form-group-full">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" name="productDescription" rows="5" placeholder="Décrivez votre produit..."></textarea>
          </div>

          <div class="form-actions form-group-full">
            <button type="submit" id="submitProductBtn" class="btn btn-primary">Ajouter le produit</button>
            <button type="button" id="cancelEditBtn" class="btn btn-outline hidden">Annuler</button>
          </div>
        </form>
      </section>

      <section class="admin-panel">
        <div class="panel-head panel-head-split">
          <h2>Produits existants</h2>
          <span id="productCountBadge" class="panel-badge">0 produit(s)</span>
        </div>
        <div id="existingProductsList" class="existing-products-list"></div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop admin-confirm-backdrop" id="adminConfirmBackdrop" hidden>
    <div class="modal-box admin-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Supprimer le produit ?</h3>
      <p>Voulez-vous vraiment supprimer ce produit ?</p>
      <div class="confirm-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-outline">Annuler</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-primary">Supprimer</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
